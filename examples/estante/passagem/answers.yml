q3:
  answer: "Todo dia: backup as 2h30. Seg a sex as 7h: lembretes por e-mail. Toda semana e todo mes: nada. Todo ano em fevereiro: importacao dos alunos, CSV que vem da secretaria, precisa ser UTF-8. No comeco de cada semestre a Joana cadastra os livros novos e imprime as etiquetas. Quem confere o backup: nao sei, nunca combinei isso com ninguem. Caderno de registro: nao sei de nenhum. Quem faz a importacao de fevereiro: nao deixei definido, acho que seria a Denise, mas confirma com a Marcia."
  answered_by: user
